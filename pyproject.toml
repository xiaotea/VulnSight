[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnsight"
version = "1.1.0"
description = "VulnSight: Semantics-Guided Vulnerability Verification for Open-Source Software"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "openai",
  "unidiff",
  "javalang",
  "clang",
  "setuptools"
]
